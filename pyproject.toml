[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "streampulse-engine"
version = "0.1.0"
description = "Real-time distributed telemetry streaming and adaptive anomaly detection (Kafka + PySpark Structured Streaming + PostgreSQL + FastAPI)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
producer = ["confluent-kafka>=2.5", "psycopg[binary]>=3.2"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "psycopg[binary]>=3.2", "psycopg-pool>=3.2"]
streaming = ["pyspark==4.0.1", "pandas>=2.2", "pyarrow>=17", "psycopg2-binary>=2.9"]
bench = ["matplotlib>=3.8", "requests>=2.32"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["config*", "producer*", "streaming*", "detection*", "api*", "benchmarks*"]

[tool.setuptools.package-data]
config = ["*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "spark: requires a local PySpark + Java runtime",
    "integration: requires the docker compose stack to be running",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends"]
